services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-ai-postgres
    environment:
      POSTGRES_DB: enterprise_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d enterprise_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: enterprise-ai-agent
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      API_KEY: ${API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: enterprise_agent
      DB_USER: agent_user
      DB_PASSWORD: agent_password
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: